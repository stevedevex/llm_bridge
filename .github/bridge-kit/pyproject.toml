[project]
name = "bridge-kit"
version = "0.1.0"
description = "bridge-kit: helps BAs write complete, checked specs with AI agents."
requires-python = ">=3.11"
dependencies = [
    "olefile>=0.47",
    "openpyxl>=3.1.5",
    "pymongo>=4.19.0",
    "pypdf>=6.0",
    "pyyaml>=6.0",
]

[project.scripts]
bridge-kit = "bridge_kit.cli:main"

[dependency-groups]
dev = [
    "mcp>=2.3.0",
    "pytest>=8.3",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
